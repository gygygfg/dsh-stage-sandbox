# WinStageSandbox 主机插件 bundle
#
# ── 开关语义（本轮修复的核心）────────────────────────────────────────────────────
# 设置页那个开关 = **这一个 bundle 的总闸**：
#   开 → 暂存面接管 `ctx.fs`（变更落暂存树、读取走投影、面板审批），/winstage 命令生效；
#   关 → 暂存面整体退回**平台原来的沙箱/审批模式**，面板与轮询卸载，命令面如实拒绝执行。
# 关闭**不需要卸载或重挂任何 loader 行**：`winstage-fs` 行的基类就是平台的
# `@deepseek-ai/dsh-fs-sandbox` 的 `SandboxedFileSystem`，而 `staging-fs.mjs` 的每个
# 覆盖层都先查 `stagingEnabled()`（现读 host 行 `config.enabled`），为假就直接 `super.*`。
# 于是"关"= 原样退回平台面（围栏 / FS_SANDBOX_DENIED / 同回合升权提示 / sandboxMode 全一致）。
#
# ── 为什么不做"行级热切换"────────────────────────────────────────────────────────
# 看起来更直观的做法是：关掉开关就把下面的 `winstage-fs` 行 disable、把 `fs-sandbox`
# 行 enable。**不能这么做**：`fs` 这个服务名同时只能有一个提供方，而
# `EntryGroup.update()` 对同一层的 id **并发** `create()`；被关掉那行的
# `fiber.dispose()`（内部异步）不 await，新打开那行的 `provide('fs')` 可能先执行
# ⇒ `service "fs" has been registered at <...>` 硬失败。本 profile 在线切换 bundle 时
# **实测崩过宿主进程**（docs/DSH集成.md §4）。所以：一个提供方、两种面；开关只切面。
#
# ── 装配（按依赖顺序）────────────────────────────────────────────────────────────
#   1. `winstage-sandbox`（host-plugin.mjs）：设置开关、审阅快照、/winstage 命令面。
#      用**裸包名** `dsh-winstage-sandbox`：`package.json` 的 `exports["."]` =
#      `./host-plugin.mjs`，与子路径 `.../host-plugin` 是**同一个模块 URL**（不会二次 apply）。
#      理由（实测源码，行号取自 dsh-client-modules/lib/index.js）：
#        `:82-88 exactPackageSpecifier()` 对 `@scope/name/sub` 三段 specifier 返回 undefined
#        → `:747 locatePkgJson()` 直接 `return undefined`
#        → `:836 processOne()` 收不到 source（`:858 resolveSource` 返回 undefined）
#        → **client 半永远不下发，审阅悬浮窗永远不会出现**（与"页面没刷新"无关）。
#   2. 关掉平台自带的 `fs-sandbox`（它是 `ctx.fs` 的默认提供方）：同一服务名**不能**
#      重复注册（cordis 硬失败），所以"替换"必须写成"禁用 + 插入"。
#   3. 插入 `winstage-fs`（fs-entry.mjs → staging-fs.mjs）：本 bundle 的 `ctx.fs` 提供方。
#      开关**开**时，工作区**之外**的写入同样进暂存（S3a：硬拒与 `FS_SANDBOX_DENIED`
#      已从暂存面删除；外部条目的键 = 规范化绝对路径），批准后才按原始绝对路径落盘；
#      只有显式 `WINSTAGE_STAGE_OUTSIDE=direct` 才直通真实磁盘（逃生口，默认关闭）。
#
# 注意：`name` 在非 insert 补丁里是**断言**，不匹配时**整条补丁（连 config）一起被跳过**
# （cordis-plugin-include/lib/index.js:95-98 `warn(...); continue;`；且 :99-102 的 overrides
# 里 name 被排除 —— 非 insert 的 name 只能断言、永远不能重命名），所以这里逐字写全。
# 推论：下面 `winstage-sandbox` 行若是改名，任何**同 id 的 profile 覆盖层**若仍断言旧行名，
# 会被静默丢弃（含它携带的 config）。3081 的
# `.t\dsh2\home\profiles\dsh2\cordis.patch.yml` 就是这个形态，必须与本文件同步改名。
#
# ── C-8：两个"根"结构性同源（本轮加了一道**运行期**守卫）────────────────────────
# host 行用 `config.workspaceRoot`、fs 行用 `config.cwd` 表达同一个暂存根。两者一旦漂移，
# `getReviewService()`（review-service.mjs，按 canonical 根做**进程内单例**）会产生两个
# 单例 ⇒「暂存写到 A、快照发布在 B」，面板永远看不到改动。因此这里用 YAML 锚点把两者
# 绑成**同一个字面值**：改一处即两处同改。fs 行额外带一个 `workspaceRoot`，供
# `staging-fs.mjs` 的 fail-closed 自校验使用（两键都给了且不一致 → 直接 throw）。
#
# ★ **shell 半边的根不再猜 `process.cwd()`**（那正是"两个根"的成因，实测见
#   `git 历史（历史归档已清理）` §1）：`shell-executor.mjs` 的
#   `effectiveWorkspaceRoot()` 现读 loader 行表，取 **fs 行的 `cwd`** 作为权威根
#   （它才是 fs 半边建 Store 用的那个值），并与 shell 行的 `workspaceRoot` 交叉校验；
#   两处不一致 ⇒ error 级日志 + 以 fs 根为准（绝不按两个根分叉出两个单例）。
#   缺失显式配置 ⇒ 抛 `WINSTAGE_SHELL_NO_WORKSPACE_ROOT`（绝不回退 cwd）。
#   ⚠ 推论：**profile 覆盖层若覆盖 `winstage-shell` 行，必须重述 `workspaceRoot`**；
#     覆盖 `winstage-fs` 行则必须重述 `cwd` 与 `workspaceRoot`（config 是整体替换）。

- id: fs-sandbox
  name: '@deepseek-ai/dsh-fs-sandbox'
  disabled: true

# ── shell 执行面：**按开关择一装载**（装配层；本轮"修复②"改了门控口径）──────────
# 目标：**恰好一个** shell 提供方启用，且跟随设置页那个开关 ——
#   开关**开** ⇒ 平台 `pwsh-sandbox` 让位、`winstage-shell` 接管（命令在沙箱内跑、产出进暂存）；
#   开关**关** ⇒ 平台 `pwsh-sandbox` 接管（完全恢复原生 shell 行为）。
#
# 为什么需要这条（实测出来的结构性缺口）：
#   `ctx.shell` 是**单例服务名**，两个提供方不能共存；而被禁用的那一行**根本不提供**服务。
#
# ── 修复②（上一轮）：门控从"进程环境变量"改为"profile 开关"────────────────────────
# 旧口径 = `WINSTAGE_SHELL=1` **且** profile 开关未关。实测代价（两处独立证据）：
#   1. `docs/DSH沙箱边界-实例侧实测.md` §5.1/§5.2、`docs/T7-暂存键重开与逐载体注入报告.md` §4.1：
#      第二实例从未设过 `WINSTAGE_SHELL` ⇒ `winstage-shell` 行**永远不装载**，
#      `ctx.shell` 一直是平台 `pwsh-sandbox` ⇒ "本实例的 shell 既没有暂存、
#      **也没有注册表暂存**、也没有读遮蔽"。这正是用户报障"**注册表更改没有走暂存审批、
#      而是直接失败**"的直接成因：没有 shim 就没有覆盖层，注册表写只剩受限令牌的内核硬拒。
#   2. 该门控是**进程级**的（改它必须重启宿主），而"开关"却在设置页里随时可切
#      ⇒ 用户看到的开关与真实生效的 shell 面**经常不一致**（开关开了、shell 仍是平台的）。
# 新口径：**profile 开关是唯一权威**，环境变量降级为显式逃生口：
#   · `WINSTAGE_SHELL=0` ⇒ 强制交还平台 shell（诊断用，优先级最高）；
#   · `WINSTAGE_SHELL=1` ⇒ 强制 WinStage 接管（诊断用，可越过"开关关"）；
#   · 否则 ⇒ 读 profile 开关：开（或读不出）＝接管，关＝交还。
#   注意：**行级 `disabled` 只在加载期求值一次** ⇒ 改开关要重启宿主才换 shell 提供方；
#   而 `ctx.fs` 的暂存面是运行期现读 `config.enabled`（见 `staging-fs.mjs`），因此
#   "开关一开、文件面立刻变、shell 面要重启"这条差异是**已知且如实记录**的。
#
# ── 修复③（R17 · P0）：profile 覆盖层的定位**不能只靠进程环境变量**──────────────────
# 实测（真实缺陷）：DSH desktop host（PID 11028）的 PEB 环境只有 50 项、**没有
#   DSH_HOME / DSH_PROFILE**（那是 Harness 给**工具子进程**注入的，不是宿主自己的）
#   ⇒ 上一版表达式只读这两个 env，读取段落进 fail-safe(true) ⇒ **开关写着 `enabled: false`，
#   命令面仍被 WinStage 接管**：本会话 pwsh 的 cwd 被重定向进暂存根、真实盘看不到写入。
# 证据：`.lead/logs/cordis-auditor/host-env-11028.txt`、`.lead/logs/cordis-auditor/gate-probe.log`。
#
# 现读取顺序（`PROFILE_SWITCH_READER_SOURCE`，与 `dsh-plugin/assembly-toggle.ts` **逐字共享**）：
#   1. **ctx.baseUrl（首选）**：`dsh-app-boot` 的 `boot()` 逐字执行
#      `ctx.baseUrl = pathToFileURL(dirname(absoluteConfigPath)).href + "/"`
#      （`.lead/asar/.../dsh-app-boot/lib/index.js:4525`），desktop 的
#      `absoluteConfigPath = <profile.dir>/cordis.yml`（`dsh/lib/profile-boot-*.js:289/302`）
#      ⇒ `new URL('cordis.patch.yml', ctx.baseUrl)` 精确指向 profile 覆盖层。
#      该 ctx 在 `!!js` 求值作用域里可用：`Entry.ctx` 继承 `Loader.ctx`
#      （`cordis-plugin-loader/lib/index.js:133/322`），`Entry.disabledOf()` →
#      `evaluate(this.ctx, …)`（`:347-352`）就是 `with (ctx) { eval(expr) }`（`:233-237`）。
#      实测：干净进程 + 真 Loader + 真 Entry 里 `ctx.baseUrl` 逐字等于
#      `file:///C:/Users/12075/.dsh/profiles/desktop/`（gate-probe.log E2）。
#   2. env 回退：`DSH_HOME` + `DSH_PROFILE`（CLI / 自测 / 工具子进程场景）。
#   3. 都拿不到 / 文件不存在 / 正则不匹配 / 抛错 ⇒ fail-safe `true`（= 接管，保持历史行为）。
#      ⚠ 这一档**刻意保留**：把"读不懂"解释成"关闭"会让用户**静默失去沙箱**，比保守更危险。
#      回归门 `tests/assembly-toggle-selftest.ts` B 段把它钉成"刻意 fail-safe"，不要改反。
#
# `!!js` 的求值器是同步的 `new Function('ctx','expr','with (ctx) { return eval(expr) }')`
#   （`cordis-plugin-loader/src/config/utils.ts:5-9`），其中**`require` 不可用**
#   （实测 `typeof require === 'undefined'`），唯一可用读文件通道是
#   `process.getBuiltinModule('node:fs')` —— 下面两个表达式就用它。
#
# ★ 与 `dsh-plugin/assembly-toggle.ts` 的 `winStageEnabledFromProfile()` / `shellProviderPlan()`
#   必须一致：那边是 host 侧纯函数（直接 import），这边是装配侧（只能内联）。
#   改一处必须同步另一处；`tests/assembly-toggle-selftest.ts` 会在 env × ctx.baseUrl ×
#   profile 三态矩阵上把 YAML 表达式与模块纯函数**逐格对拍**。
#
# ★ 两个表达式**必须逐字成对取反**：否则会"两个都禁用"（`ctx.shell` 服务缺失 ⇒
#   所有 shell 命令不可用）或"两个都启用"（cordis 服务重复注册 ⇒ 加载即失败）。
#
# 注意：`name` 在非 insert 补丁里是**断言**，不匹配时**整条补丁（连 config）一起被跳过**
# （cordis-plugin-include/lib/index.js:95-98 `warn(...); continue;`；且 :99-102 的 overrides
# 里 name 被排除 —— 非 insert 的 name 只能断言、永远不能重命名），所以这里逐字写全。
# 推论：下面 `winstage-sandbox` 行若是改名，任何**同 id 的 profile 覆盖层**若仍断言旧行名，
# 会被静默丢弃（含它携带的 config）。3081 的
# `.t\dsh2\home\profiles\dsh2\cordis.patch.yml` 就是这个形态，必须与本文件同步改名。
- id: pwsh-sandbox
  name: '@deepseek-ai/dsh-pwsh-sandbox'
  # 让位条件 = WinStage 接管（开关开 或 `WINSTAGE_SHELL=1`）且未被 `WINSTAGE_SHELL=0` 强制交还。
  # 与下面 `winstage-shell` 行**逐字成对取反**（见文件头"修复②"）。
  #
  # ⚠ 表达式里**不得出现 `: `（冒号+空格）**：YAML 会把它当成映射键分隔符，于是整条
  #   `disabled` 变成 `{'[object Object]': …}` 而不是布尔 —— 行照旧"启用"，
  #   但**两个 shell 提供方都不让位**（实测 dump：`disabled:\n  '[object Object]': >-`）。
  #   本机因此踩过一次；回归门 `tests/assembly-toggle-selftest.mjs` A6 钉住。
  disabled: !!js (process.env.WINSTAGE_SHELL !== '0') && ((process.env.WINSTAGE_SHELL === '1') || (() => { try { const fs = process.getBuiltinModule('node:fs'); let p = null; if (process.env.DSH_HOME && process.env.DSH_PROFILE) p = process.env.DSH_HOME + '/profiles/' + process.env.DSH_PROFILE + '/cordis.patch.yml'; try { if (ctx && typeof ctx.baseUrl === 'string' && ctx.baseUrl.length > 0) p = new URL('cordis.patch.yml', ctx.baseUrl) } catch {} if (!p) return true; if (!fs.existsSync(p)) return true; const m = /id:\s*winstage-sandbox\b([\s\S]*?)(?=\s*-\s*id:|\s*$)/.exec(fs.readFileSync(p, 'utf8')); if (!m) return true; const e = /enabled:\s*(true|false)\b/.exec(m[1]); return !e || e[1] !== 'false' } catch { return true } })())

- insert:
    - id: winstage-sandbox
      # 裸包名（**不要**改回子路径 specifier —— 见文件头的源码依据）。
      name: 'dsh-winstage-sandbox'
      config:
        enabled: true
        workspaceRoot: &winstageRoot C:\Users\12075\Desktop\dsh-stage-sandbox
        probeOnStart: true
        # ── R16 修复 · D5-R16-1：网络档位的入口**不在本行**，在下面的 `winstage-shell` 行 ──
        # R15（D5-N5）曾把 `networkTier` 写在本行，R16 实测证明那是**死键**：
        #   唯一读者是 `shell-executor.mjs` 的
        #   `normalizeNetworkTier(stringOption(raw, 'networkTier') ?? env)`，
        #   而 `raw` 取的是 **shell 行** 的 config（`shell-executor.mjs:1067`；源码依据见
        #   `shell-executor.mjs:989/:1005`）。`grep networkTier dsh-plugin/*.mjs` 只命中
        #   `shell-executor.mjs`，`host-plugin.mjs` 0 命中 ⇒ 写在本行只会静默无效。
        #   实测（`.t\r16\network\`）：本行注入 `OFFLINE` 后 lane 仍 `requested=OBSERVED_ONLINE`
        #   且命令照跑；改写 shell 行才生效。
        # ⚠ profile 覆盖层对**整行 config 做整体替换**：覆盖层若要改档位，必须在
        #   `winstage-shell` 行重述 `networkTier`（见 `profiles/sbx` 的对应行）。

    - id: winstage-fs
      # **必须**保持子路径 specifier（不要改成裸包名）：
      #   a) 裸名解析到 `exports["."]` = host-plugin.mjs，会把 host-plugin **apply 两次**
      #      （命令 definitionId 冲突）；
      #   b) 改名会让 profile 覆盖层（断言 `.../fs`）整条被跳过，丢掉 `cwd` 隔离配置。
      name: 'dsh-winstage-sandbox/fs'
      config:
        # `cwd` 同时是暂存工作区根：`ctx.fs` 的解析基准与暂存树的根必须是同一个目录。
        # 与 host 行的 `workspaceRoot` 共用同一个锚点（C-8：结构性同源）。
        cwd: *winstageRoot
        # fail-closed 自校验用：与 `cwd` 不一致时 staging-fs.mjs 直接 throw。
        workspaceRoot: *winstageRoot

    - id: winstage-shell
      # 子路径 specifier（与 fs 行同理：裸名会把 host-plugin 装第二遍）。
      name: 'dsh-winstage-sandbox/shell'
      # 不激活 = WinStage 未接管（开关关 且 未被 `WINSTAGE_SHELL=1` 强制）
      # 或已被 `WINSTAGE_SHELL=0` 强制交还。与上面 `pwsh-sandbox` 行**共用同一对条件**，
      # 保证"恰好一个启用"（服务名单例：两个都禁用 ⇒ shell 不可用；两个都启用 ⇒ 加载失败）。
      #
      # ⚠ 同样**不得出现 `: `（冒号+空格）**：会被 YAML 当成映射键分隔符（见上面
      #   `pwsh-sandbox` 行的实测说明）。因此这里用 `!== '0' && (…)` 而不是三目。
      disabled: !!js (() => { const on = (process.env.WINSTAGE_SHELL !== '0') && ((process.env.WINSTAGE_SHELL === '1') || (() => { try { const fs = process.getBuiltinModule('node:fs'); let p = null; if (process.env.DSH_HOME && process.env.DSH_PROFILE) p = process.env.DSH_HOME + '/profiles/' + process.env.DSH_PROFILE + '/cordis.patch.yml'; try { if (ctx && typeof ctx.baseUrl === 'string' && ctx.baseUrl.length > 0) p = new URL('cordis.patch.yml', ctx.baseUrl) } catch {} if (!p) return true; if (!fs.existsSync(p)) return true; const m = /id:\s*winstage-sandbox\b([\s\S]*?)(?=\s*-\s*id:|\s*$)/.exec(fs.readFileSync(p, 'utf8')); if (!m) return true; const e = /enabled:\s*(true|false)\b/.exec(m[1]); return !e || e[1] !== 'false' } catch { return true } })()); return !on })()
      config:
        # 与 fs/host 两行共用同一个暂存根锚点（C-8：结构性同源）。
        # `shell-executor.mjs` 的 `effectiveWorkspaceRoot()` 以 **fs 行的 `cwd`** 为权威、
        # 与这里的值交叉校验；漂移 ⇒ error 级日志 + 以 fs 根为准（绝不两个根各建一个单例）。
        workspaceRoot: *winstageRoot
        # ── R16 修复 · D5-R16-1：网络档位的**唯一有效入口**（默认值 = 既有行为，逐字不变）──
        # `OBSERVED_ONLINE`（默认）：不安装任何 WFP 过滤器，出站/入站全开；执行器仍把档位与
        #   `enforced:false` 如实写进 `sandbox-lane.json` 的 `network` 段。
        # `OFFLINE`：执行器尝试安装真实 WFP 过滤器（`src/netpolicy.mjs::installNetworkPolicy`），
        #   **挡不住就 fail-closed 拒绝执行命令**（`src/executor.mjs` 的既有判定）。
        # 读取处：`shell-executor.mjs:1067`
        #   `normalizeNetworkTier(stringOption(raw,'networkTier') ?? stringOption(process.env,'WINSTAGE_NETWORK_TIER'))`
        #   —— `raw` = **本行** config；环境变量 `WINSTAGE_NETWORK_TIER` 是显式逃生口（同一优先级链）。
        # ⚠ 本行 config 被 profile 覆盖层**整体替换**：覆盖层若重述本行而不带 `networkTier`，
        #   本键会被丢弃并回落默认（`profiles/sbx/cordis.patch.yml` 已同步重述，见 R16 修复说明）。
        networkTier: OBSERVED_ONLINE
