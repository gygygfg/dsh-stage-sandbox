  '@deepseek-ai/dsh-attachment': 'file:.dsh-vendor/node_modules/@deepseek-ai/dsh-attachment'
  '@deepseek-ai/dsh-bash-local': 'file:.dsh-vendor/node_modules/@deepseek-ai/dsh-bash-local'
  '@deepseek-ai/dsh-bash-sandbox': 'file:.dsh-vendor/node_modules/@deepseek-ai/dsh-bash-sandbox'
  '@deepseek-ai/dsh-brand': 'file:.dsh-vendor/node_modules/@deepseek-ai/dsh-brand'
  '@deepseek-ai/dsh-commands': 'file:.dsh-vendor/node_modules/@deepseek-ai/dsh-commands'
